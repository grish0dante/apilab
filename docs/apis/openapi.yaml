openapi: 3.0.3
info:
  title: Financial System API
  description: API for managing bank accounts and transactions.
  version: 1.0.0
  contact:
    name: Hrishanov Danylo
servers:
  - url: https://api.finance-app.local/v1
paths:
  /accounts:
    get:
      summary: Get list of accounts
      responses:
        '200':
          description: Successful response
    post:
      summary: Create account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountInput'
      responses:
        '201':
          description: Account created
  /transactions:
    post:
      summary: Perform transaction
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransactionInput'
      responses:
        '201':
          description: Trasaction successful
        '400':
          description: Not enough funds or invalid account IDs

components:
  schemas:
    AccountInput:
      type: object
      properties:
        owner_name:
          type: string
        currency:
          type: string
          example: "USD"
    TransactionInput:
      type: object
      properties:
        from_account_id:
          type: string
        to_account_id:
          type: string
        amount:
          type: number
          format: float